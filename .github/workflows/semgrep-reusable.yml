name: Semgrep (Reusable)

on:
  workflow_call:
    inputs:
      base:
        description: "Revision whose findings are already known; only findings new against it fail"
        required: true
        type: string
      configs:
        description: "Space-separated Semgrep configs, such as registry packs or rule files"
        required: false
        default: "p/ci p/secrets"
        type: string
      exclude_rules:
        description: "Space-separated rule ids to skip"
        required: false
        default: ""
        type: string
      timeout:
        description: "Per-rule timeout in seconds; a rule that times out drops its findings"
        required: false
        default: 30
        type: number
      semgrep_version:
        description: "Semgrep release installed with pip"
        required: false
        default: "1.177.0"
        type: string
      runs_on:
        description: "Runner label"
        required: false
        default: "ubuntu-latest"
        type: string
      rules_dir:
        description: "Folder of the caller's own rules; each rule must fire on its fixtures and find nothing in the code"
        required: false
        default: ""
        type: string

permissions:
  contents: read

jobs:
  scan:
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        env:
          SEMGREP_VERSION: ${{ inputs.semgrep_version }}
        run: python -m pip install "semgrep==$SEMGREP_VERSION"

      - name: Own rules hold on their fixtures and the code
        if: inputs.rules_dir != ''
        env:
          RULES: ${{ inputs.rules_dir }}
        run: |
          for rule in "$RULES"/*.yml; do
            for fixture in "${rule%.yml}".*; do
              [[ "$fixture" == "$rule" ]] || semgrep --metrics off --test --config "$rule" "$fixture"
            done
          done
          semgrep scan --error --strict --metrics off --config "$RULES" .

      - name: Resolve the merge base of the head and the base
        id: baseline
        env:
          BASE: ${{ inputs.base }}
        run: |
          sha="$(git merge-base "$BASE" HEAD)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"

      # A rule that times out drops its findings, so a scan whose only errors are timeouts runs once more.
      - name: Fail on findings new against the base
        env:
          BASE: ${{ steps.baseline.outputs.sha }}
          CONFIGS: ${{ inputs.configs }}
          EXCLUDE_RULES: ${{ inputs.exclude_rules }}
          TIMEOUT: ${{ inputs.timeout }}
        run: |
          args=()
          for config in $CONFIGS; do args+=(--config "$config"); done
          for rule in $EXCLUDE_RULES; do args+=(--exclude-rule "$rule"); done
          report="$RUNNER_TEMP/semgrep.json"
          scan() {
            semgrep scan --error --strict --verbose --timeout "$TIMEOUT" --metrics off "${args[@]}" --baseline-commit "$BASE" --json-output="$report"
          }
          code=0
          scan || code=$?
          if [[ "$code" != 0 ]] && jq -e '(.results | length) == 0 and (.errors | length) > 0 and all(.errors[]; .type == "Timeout")' "$report" > /dev/null 2>&1; then
            echo "Semgrep timed out with no other error, scanning once more: $(jq -r '[.errors[] | "\(.rule_id) on \(.path)"] | unique | join(", ")' "$report")" >&2
            code=0
            scan || code=$?
          fi
          exit "$code"
