name: Locked Tests (Reusable)

# A manifest of locked pytest tests (scripts/check_locked_tests.py): a listed
# test that is deleted, skipped (decorator, pytestmark, skip call) or weakened
# (fewer asserts, changed literals) turns this red unless the manifest changes
# in the same PR. Static (ast): installs nothing and runs no test.

on:
  workflow_call:
    inputs:
      manifest:
        description: "Manifest path, from the caller's repo root"
        required: false
        default: "tests/LOCKED_MANIFEST.json"
        type: string
      min_tests:
        description: "Floor on how many tests the manifest lists (0 = the manifest's own min_tests)"
        required: false
        default: 0
        type: number
      runs_on:
        description: "Runner label"
        required: false
        default: "anton-light"
        type: string
      tools_ref:
        description: "Ref of The-Cloud-Clockwork/.github that supplies the checker"
        required: false
        default: "main"
        type: string

jobs:
  locked:
    name: Locked tests
    runs-on: ${{ inputs.runs_on }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/checkout@v4
        with:
          repository: The-Cloud-Clockwork/.github
          ref: ${{ inputs.tools_ref }}
          path: .ci-shared
          sparse-checkout: scripts

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Locked tests are present, unskipped and unweakened
        env:
          MANIFEST: ${{ inputs.manifest }}
          MIN_TESTS: ${{ inputs.min_tests }}
        run: |
          python .ci-shared/scripts/check_locked_tests.py --manifest "$MANIFEST" --min "$MIN_TESTS" | tee locked.txt
          rc=${PIPESTATUS[0]}
          { echo '### Locked tests'; echo '```'; grep -E "^(LOCKED|locked tests)" locked.txt | head -200; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
          exit "$rc"
